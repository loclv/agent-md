[package]
name = "agent-md"
version = "0.2.15"
edition = "2021"
description = "Fast Markdown editor, linter, and formatter designed for AI agents"
license = "MIT"
repository = "https://github.com/loclv/agent-md"
homepage = "https://github.com/loclv/agent-md"
documentation = "https://github.com/loclv/agent-md"
readme = "README.md"
keywords = ["markdown", "ai", "agents", "linter", "formatter"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
exclude = [
  ".agents/*",
  ".antigravitycli/*",
  ".github/*",
  ".opencode/*",
  ".ralph/*",
  ".vscode/*",
  "codedb.snapshot",
  "logs/*",
  "markdownlint/*",
  "test-md/*",
  "vscode-extension/*",
]

[lib]
name = "agent_md"
path = "src/lib.rs"

[[bin]]
name = "agent-md"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pulldown-cmark = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
chrono = "0.4"

[profile.release]
strip = true
lto = true
opt-level = "z"
